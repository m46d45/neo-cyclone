version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@tanstack/*"
      versions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
        exclude-patterns:
          - "@tanstack/*"
